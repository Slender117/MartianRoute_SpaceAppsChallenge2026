name: web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", "package*.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "packages/**", "package*.json", ".github/workflows/web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web
