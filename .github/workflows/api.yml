name: api

# El pipeline cuenta porque la prueba del escenario de demo corre sobre su salida.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pipeline/**"
      - "docs/supuestos.md"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "pipeline/**"
      - "docs/supuestos.md"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: apps/api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pip install -e ../../pipeline
      - run: marsdata synthetic
      - run: pytest -q
