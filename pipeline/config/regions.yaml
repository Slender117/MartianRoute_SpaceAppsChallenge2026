# Regions the pipeline processes. Start with Jezero only; Gale is optional.
# bbox: [lon_min, lat_min, lon_max, lat_max] in degrees (planetocentric, east positive)
# size: grid size in cells (rows = columns). Between 256 and 1024 so routing answers quickly.

regions:
  jezero:
    name: Jezero Crater
    # Largest nearly square box where the NOAH-H mosaic (Wright et al., 2022) has a class in
    # at least 95 % of the cells (95.4 %; HE1). The NOAH-H gaps are at the edges, outside
    # the four classified HiRISE images. It contains the base, the demo end and Edgar's 36
    # stretches with full NOAH-H coverage.
    bbox: [77.316, 18.339, 77.566, 18.590]
    size: 600 # ~24.8 m per cell north-south and ~23.4 m east-west
    base: { lat: 18.4447, lon: 77.4508 } # Perseverance landing site
    dataset_version: 0.4.0
    # Demo scenario of the synthetic region: synthetic.py shapes the terrain for these points.
    demo:
      label: Base in front of the delta (synthetic scenario)
      start: { lat: 18.4447, lon: 77.4508 }
      end: { lat: 18.4685, lon: 77.3932 }
    # Demo scenario with real data (marsdata build). Edgar tested ~1,500 destinations: in this one,
    # to the southeast, the three modes take different paths (HE2) and Safe avoids almost all the
    # risk for a little more O₂.
    demo_real:
      label: Base southeast of the delta (real Jezero)
      start: { lat: 18.4447, lon: 77.4508 }
      end: { lat: 18.4088, lon: 77.4886 }
    traverses: [perseverance]
    # Real traverse (JPL MMGIS, one LineString per sol) and NOAH-H class-to-risk table
    # (Edgar), with paths from the repository root.
    traverse_files: { perseverance: M20_traverse_2026-11-12.json }
    hazard_table: science/validation/noahh_ig_risk.csv
    # Names in the 3D view (besides the start and end of the traverse, which are added automatically).
    # `only: synthetic` or `only: real` limits a label to one of the two versions of the region.
    labels:
      - { name: "Base · Perseverance landing site", lat: 18.4447, lon: 77.4508, source: base }
      - { name: "Demo destination", lat: 18.4685, lon: 77.3932, source: demo, only: synthetic }
      - { name: "Demo destination: distinct modes", lat: 18.4088, lon: 77.4886, source: demo, only: real }
      # Destination to mark by hand in the presentation: the short route climbs slopes and Safe goes
      # around them with 13-29 % less O₂ and half the risk (Edgar's analysis on real Jezero).
      - { name: "O₂ savings on slopes", lat: 18.5223, lon: 77.4289, source: demo, only: real }
    sources:
      # Local paths to the files downloaded into data/raw/<region>/. Citations in docs/creditos.md.
      # DEM and orthophoto come from the same Mars 2020 navigation set (USGS, 2020): the orthophoto
      # was orthorectified with that DTM, so relief and texture match by construction.
      dem: JEZ_ctx_B_soc_008_DTM_MOLAtopography_DeltaGeoid_20m_Eqc_latTs0_lon0.tif # doi:10.5066/P906QQT8
      ortho: JEZ_ctx_B_soc_008_orthoMosaic_6m_Eqc_latTs0_lon0.tif # doi:10.5066/P9GV1ND3
      # Jezero crop (with a 0.05° margin) of the 32-bit quantitative mosaic, read by window.
      thermal_inertia: THEMIS_TI_Mosaic_Quant_00N060E_100mpp_jezero.tif
      # NOAH-H IG mosaic (Wright et al., 2022), risk from science/validation/noahh_ig_risk.csv.
      # Extracted by hand from the Open University .zip (see docs/creditos.md). It covers 95.4 % of
      # the bbox; the rest is nodata (127).
      hazard: Jezero_NOAHH_mosaic_IG.tif
      minerals: crism_summary.tif # product to be defined (CRISM or a published mineral map)
      ice: swim_ice.tif # check first whether SWIM covers Jezero

  # Walking zone: third zoom level with HiRISE (1 m DTM and 25 cm orthophoto from the Mars 2020
  # navigation set), reduced to ~3 m per cell. A ~1.8 km box centered on the base; move it
  # if the demo walk falls elsewhere. HiRISE covers the base and the demo end.
  jezero_walk:
    name: Jezero, walking zone (HiRISE)
    bbox: [77.4358, 18.4297, 77.4658, 18.4597]
    size: 600 # ~2.96 m per cell north-south
    base: { lat: 18.4447, lon: 77.4508 } # Perseverance landing site
    dataset_version: 0.1.0
    traverses: [perseverance]
    traverse_files: { perseverance: M20_traverse_2026-11-12.json }
    hazard_table: science/validation/noahh_ig_risk.csv
    labels:
      - { name: "Base · Perseverance landing site", lat: 18.4447, lon: 77.4508, source: base }
    sources:
      dem: JEZ_hirise_soc_006_DTM_1m_jezero_walk.tif # doi:10.5066/P9REJ9JN
      ortho: JEZ_hirise_soc_006_orthoMosaic_25cm_jezero_walk.tif # doi:10.5066/P9QJDP48
      thermal_inertia: THEMIS_TI_Mosaic_Quant_00N060E_100mpp_jezero_walk.tif
      hazard: Jezero_NOAHH_mosaic_IG.tif # the same mosaic as jezero

  gale:
    name: Gale Crater
    # 0.25° box centered on Curiosity at sol 5073 (MMGIS, 14 Nov 2026), inside the
    # Gale HiRISE DEM coverage. Bradbury Landing (the landing site) is 14 km to the north.
    bbox: [137.264, -4.951, 137.514, -4.701]
    size: 600 # ~24.7 m per cell north-south and ~24.6 m east-west
    base: { lat: -4.8260, lon: 137.3889 } # Curiosity at sol 5073
    dataset_version: 0.2.0
    traverses: [curiosity]
    # MMGIS traverse with the sol of each segment: python -m marsdata.fetch.mmgis MSL <file>.
    traverse_files: { curiosity: MSL_traverse_2026-11-14.json }
    # Within a single drive, the Curiosity file has vertices up to 59.5 m apart.
    traverse_max_gap_m: 60
    labels:
      - { name: "Base · Curiosity (sol 5073)", lat: -4.8260, lon: 137.3889, source: base }
    # There is no NOAH-H for Gale: risk comes from DEM roughness (process/terrain.py), relative to
    # the region.
    hazard_proxy: roughness
    sources:
      # Window crops at 5 m of the Calef and Parker (2016) mosaics.
      dem: MSL_Gale_DEM_Mosaic_5m_gale.tif
      ortho: MSL_Gale_Orthophoto_Mosaic_5m_gale.tif
      thermal_inertia: THEMIS_TI_Mosaic_Quant_30S120E_100mpp_gale.tif
