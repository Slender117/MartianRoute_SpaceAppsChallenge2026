[project]
name = "wazemars-pipeline"
version = "0.1.0"
description = "Pipeline offline: datos de NASA → grillas de costo, texturas y heightmaps por región"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "rasterio>=1.3",  # incluye GDAL en sus wheels
    "pillow>=10",
    "pyyaml>=6",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
marsdata = "marsdata.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marsdata*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
